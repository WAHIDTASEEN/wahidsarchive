<link rel="stylesheet" href="css/site-consistency.css?v=newsletter-tools-nav-2"><script>try{document.documentElement.dataset.theme=localStorage.getItem('wahid-theme')==='dark'?'dark':'light'}catch(e){document.documentElement.dataset.theme='light'}</script><link rel="stylesheet" href="css/clay.css?v=1"><script src="js/config.js"></script><script src="js/access-gate.js"></script></head><body data-page="toolkit"><div class="site-noise"></div><div id="siteHeader"></div><main class="page-shell"><div class="page-hero"><div><span class="eyebrow"><span></span> PRIVATE SPACE</span><h1>My <i>notes.</i></h1><p>A quiet browser notebook for formulas, ideas, plans and reminders.</p></div><button class="gold-btn" id="saveNotes">Save notes</button></div><textarea class="notes-editor" id="notesEditor" placeholder="Write anything…"></textarea><div class="note-meta"><span id="noteSaved">Saved locally in this browser.</span><button class="text-link" id="clearNotes">Clear notes</button></div></main><div id="siteFooter"></div><script src="js/config.js"></script><script src="js/public-api.js?v=150"></script><script src="js/seo.js?v=2"></script><script src="js/site.js?v=newsletter-tools-nav-2"></script><script>const e=document.getElementById('notesEditor'),s=document.getElementById('noteSaved');e.value=localStorage.getItem('wahid-notes')||'';document.getElementById('saveNotes').onclick=()=>{localStorage.setItem('wahid-notes',e.value);s.textContent='Saved just now.'};document.getElementById('clearNotes').onclick=()=>{e.value='';localStorage.removeItem('wahid-notes');s.textContent='Cleared.'}</script><script src="js/feature-core.js?v=272"></script><script src="js/analytics.js?v=272"></script><script src="js/pwa.js?v=272"></script></body></html>
